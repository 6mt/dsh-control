<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8a93a5"/>
    </marker>
  </defs>

  <!-- ═══════════ 标题 ═══════════ -->
  <text x="640" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2430">场景二原型：iframe 嵌入远端完整环境</text>
  <text x="640" y="52" text-anchor="middle" font-size="12" fill="#8a93a5">三种视图状态 + 交互流程</text>

  <!-- ═══════════ 状态 1：环境列表（默认）═══════════ -->
  <rect x="20" y="70" width="390" height="360" rx="12" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="215" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">状态① 环境列表（现有）</text>

  <!-- 左侧栏示意 -->
  <rect x="35" y="110" width="55" height="310" rx="8" fill="#e8ebf0"/>
  <text x="62" y="135" text-anchor="middle" font-size="9" fill="#8a93a5">侧栏</text>

  <!-- 右侧面板 -->
  <rect x="100" y="110" width="295" height="310" rx="8" fill="#ffffff" stroke="#c9d1de"/>
  <text x="247" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2430">远程 dsh 环境</text>
  <!-- 环境行 -->
  <rect x="115" y="145" width="265" height="60" rx="8" fill="#f0f7f2" stroke="#cfe5d4"/>
  <circle cx="130" cy="165" r="4" fill="#2f9e59"/>
  <text x="142" y="168" font-size="12" fill="#1f2430" font-weight="600">cn-dsh2</text>
  <text x="142" y="182" font-size="10" fill="#8a93a5">已连接 · root@… · 已有工作区</text>
  <!-- 进入环境按钮 -->
  <rect x="115" y="195" width="120" height="26" rx="6" fill="#1f6feb"/>
  <text x="175" y="212" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">进入环境 →</text>
  <!-- 会话列表折叠 -->
  <text x="130" y="240" font-size="10" fill="#8a93a5">▸ 会话列表（可折叠）</text>
  <text x="130" y="256" font-size="10" fill="#8a93a5">  · 控制端·测试  4小时前</text>
  <text x="130" y="272" font-size="10" fill="#8a93a5">  · 数据分析    1天前</text>
  <text x="130" y="288" font-size="10" fill="#8a93a5">  · …</text>
  <!-- 底部提示 -->
  <text x="247" y="340" text-anchor="middle" font-size="9" fill="#8a93a5">管理：连接/重连/移除/打开远端界面</text>
  <text x="247" y="355" text-anchor="middle" font-size="9" fill="#8a93a5">点击「进入环境」→ 切换到状态②</text>

  <!-- ═══════════ 状态 2：iframe 嵌入（面板内）═══════════ -->
  <rect x="445" y="70" width="390" height="360" rx="12" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="640" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">状态② iframe 嵌入（面板内）</text>

  <!-- 左侧栏示意 -->
  <rect x="460" y="110" width="55" height="310" rx="8" fill="#e8ebf0"/>
  <text x="487" y="135" text-anchor="middle" font-size="9" fill="#8a93a5">侧栏</text>

  <!-- 右侧面板 - iframe 模式 -->
  <rect x="525" y="110" width="295" height="310" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
  <!-- 顶栏：环境名 + 返回 + 刷新 -->
  <rect x="525" y="110" width="295" height="32" rx="8" fill="#f0f4f8"/>
  <text x="540" y="130" font-size="11" font-weight="600" fill="#1f2430">← 返回</text>
  <text x="600" y="130" font-size="11" fill="#1f2430">cn-dsh2</text>
  <text x="740" y="130" font-size="10" fill="#1f6feb">↻ 刷新</text>
  <text x="775" y="130" font-size="9" fill="#8a93a5">⌥⌘↵</text>

  <!-- iframe 内容区：远端 GUI -->
  <rect x="530" y="148" width="285" height="268" rx="4" fill="#fafbfc"/>
  <!-- 远端 GUI 的侧栏 -->
  <rect x="530" y="148" width="50" height="268" fill="#e8ebf0" rx="4 0 0 4"/>
  <text x="555" y="175" text-anchor="middle" font-size="7" fill="#5b6472">远端</text>
  <text x="555" y="187" text-anchor="middle" font-size="7" fill="#5b6472">侧栏</text>
  <!-- 远端会话列表 -->
  <rect x="582" y="148" width="70" height="268" fill="#f0f2f5" rx="0"/>
  <text x="596" y="165" font-size="7" fill="#5b6472">远端会话</text>
  <rect x="586" y="172" width="62" height="14" rx="3" fill="#dde5f0"/>
  <text x="592" y="182" font-size="6" fill="#1f2430">● 控制端·测试</text>
  <rect x="586" y="190" width="62" height="14" rx="3" fill="transparent"/>
  <text x="592" y="200" font-size="6" fill="#5b6472">数据分析</text>
  <rect x="586" y="208" width="62" height="14" rx="3" fill="transparent"/>
  <text x="592" y="218" font-size="6" fill="#5b6472">日报生成</text>
  <!-- 远端对话区 -->
  <rect x="654" y="148" width="161" height="268" fill="#fff" rx="0 4 4 0"/>
  <rect x="660" y="158" width="149" height="80" rx="6" fill="#f5f7fa"/>
  <text x="668" y="175" font-size="7" fill="#1f2430">🤖 帮我看看今天的磁盘占用</text>
  <text x="668" y="188" font-size="7" fill="#5b6472">df -h 输出：总共 100G…</text>
  <text x="668" y="200" font-size="7" fill="#5b6472">建议清理 /tmp 下的大文件…</text>
  <!-- 输入框 -->
  <rect x="660" y="380" width="120" height="20" rx="4" fill="#f0f2f5" stroke="#d0d5dd"/>
  <text x="668" y="394" font-size="7" fill="#8a93a5">发消息到远端…</text>

  <!-- iframe 标注 -->
  <rect x="530" y="148" width="285" height="268" fill="none" stroke="#1f6feb" stroke-dasharray="4 3" rx="4"/>
  <text x="672" y="435" text-anchor="middle" font-size="9" fill="#1f6feb">iframe：远端 dsh 的完整 GUI</text>

  <!-- ═══════════ 状态 3：iframe 全屏 ═══════════ -->
  <rect x="870" y="70" width="390" height="360" rx="12" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="1065" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">状态③ 全屏模式（⌥⌘Enter）</text>

  <!-- 左侧栏隐藏 -->
  <rect x="885" y="110" width="30" height="310" rx="8" fill="#e8ebf0"/>
  <text x="900" y="135" text-anchor="middle" font-size="7" fill="#8a93a5" transform="rotate(-90 900 260)">本地侧栏收起</text>

  <!-- 全屏 iframe -->
  <rect x="922" y="110" width="323" height="310" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
  <!-- 顶栏 -->
  <rect x="922" y="110" width="323" height="32" rx="8" fill="#f0f4f8"/>
  <text x="937" y="130" font-size="11" font-weight="600" fill="#1f2430">← 返回</text>
  <text x="997" y="130" font-size="11" fill="#1f2430">cn-dsh2</text>
  <text x="1120" y="130" font-size="10" fill="#1f6feb">↻</text>
  <text x="1135" y="130" font-size="9" fill="#8a93a5">⌥⌘↵ 退出全屏</text>

  <!-- 远端 GUI 占满 -->
  <rect x="927" y="148" width="313" height="268" fill="#fafbfc" rx="4"/>
  <!-- 远端侧栏 -->
  <rect x="927" y="148" width="60" height="268" fill="#e8ebf0" rx="4 0 0 4"/>
  <text x="957" y="180" text-anchor="middle" font-size="8" fill="#5b6472">远端侧栏</text>
  <text x="957" y="195" text-anchor="middle" font-size="7" fill="#8a93a5">工作区</text>
  <text x="957" y="208" text-anchor="middle" font-size="7" fill="#8a93a5">会话</text>
  <!-- 远端会话列表 -->
  <rect x="989" y="148" width="85" height="268" fill="#f0f2f5"/>
  <text x="997" y="165" font-size="7" fill="#5b6472">远端会话</text>
  <rect x="993" y="172" width="77" height="18" rx="3" fill="#dde5f0"/>
  <text x="999" y="184" font-size="7" fill="#1f2430">● 控制端·测试</text>
  <rect x="993" y="194" width="77" height="18" rx="3" fill="transparent"/>
  <text x="999" y="206" font-size="7" fill="#5b6472">数据分析</text>
  <rect x="993" y="216" width="77" height="18" rx="3" fill="transparent"/>
  <text x="999" y="228" font-size="7" fill="#5b6472">日报生成</text>
  <rect x="993" y="240" width="77" height="18" rx="3" fill="transparent"/>
  <text x="999" y="252" font-size="7" fill="#5b6472">爬虫监控</text>
  <!-- 远端对话区（更大） -->
  <rect x="1076" y="148" width="164" height="268" fill="#fff" rx="0 4 4 0"/>
  <rect x="1082" y="158" width="152" height="100" rx="6" fill="#f5f7fa"/>
  <text x="1090" y="175" font-size="8" fill="#1f2430">🤖 帮我看看磁盘占用</text>
  <text x="1090" y="190" font-size="7" fill="#5b6472">总计 100G，已用 78G</text>
  <text x="1090" y="203" font-size="7" fill="#5b6472">/tmp 12G 可清理</text>
  <text x="1090" y="216" font-size="7" fill="#5b6472">建议运行 cleanup.sh</text>
  <rect x="1082" y="280" width="152" height="60" rx="6" fill="#eef4ff"/>
  <text x="1090" y="295" font-size="8" fill="#1f2430">👤 运行 cleanup.sh</text>
  <text x="1090" y="308" font-size="7" fill="#5b6472">正在执行…</text>
  <!-- 输入框 -->
  <rect x="1082" y="380" width="130" height="24" rx="4" fill="#f0f2f5" stroke="#d0d5dd"/>
  <text x="1090" y="396" font-size="7" fill="#8a93a5">发消息到远端…</text>

  <rect x="927" y="148" width="313" height="268" fill="none" stroke="#1f6feb" stroke-dasharray="4 3" rx="4"/>
  <text x="1083" y="435" text-anchor="middle" font-size="9" fill="#1f6feb">iframe 占满整个面板 ≈ 完整远端环境</text>

  <!-- ═══════════ 交互流程箭头 ═══════════ -->
  <line x1="415" y1="250" x2="440" y2="250" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="427" y="240" text-anchor="middle" font-size="9" fill="#8a93a5">点击</text>
  <text x="427" y="262" text-anchor="middle" font-size="9" fill="#8a93a5">进入环境</text>

  <line x1="840" y1="250" x2="865" y2="250" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="852" y="240" text-anchor="middle" font-size="9" fill="#8a93a5">⌥⌘Enter</text>
  <text x="852" y="262" text-anchor="middle" font-size="9" fill="#8a93a5">全屏</text>

  <!-- ═══════════ 底部：技术说明 ═══════════ -->
  <rect x="20" y="450" width="1240" height="90" rx="10" fill="#f0f4f8"/>
  <text x="640" y="475" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">技术实现要点</text>
  <text x="640" y="495" text-anchor="middle" font-size="10" fill="#5b6472">iframe src = http://127.0.0.1:&#60;隧道端口&#62;/?token=&#60;令牌&#62;    ·    隧道已有（SSH 模式自动建）    ·    dsh web 不设 X-Frame-Options（已验证）</text>
  <text x="640" y="512" text-anchor="middle" font-size="10" fill="#5b6472">右侧面板原生支持 ⌥⌘Enter 全屏（dsh 内置快捷键，无需插件实现）    ·    iframe 里的远端 GUI 是完整的（侧栏/会话/对话/设置）</text>
  <text x="640" y="529" text-anchor="middle" font-size="10" fill="#8a93a5">限制：iframe 与本地图形界面无联动；远端重启后需点「刷新」重新加载</text>

  <!-- ═══════════ 底部：状态切换图 ═══════════ -->
  <rect x="20" y="560" width="1240" height="240" rx="10" fill="#ffffff" stroke="#dfe3ea"/>
  <text x="640" y="588" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">面板内视图切换逻辑</text>

  <!-- 流程图 -->
  <rect x="50" y="610" width="160" height="50" rx="10" fill="#f0f4f8" stroke="#c9d1de"/>
  <text x="130" y="632" text-anchor="middle" font-size="11" fill="#1f2430" font-weight="600">环境列表</text>
  <text x="130" y="648" text-anchor="middle" font-size="9" fill="#8a93a5">（默认状态）</text>

  <line x1="215" y1="635" x2="270" y2="635" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="242" y="625" text-anchor="middle" font-size="9" fill="#1f6feb">点击「进入环境」</text>

  <rect x="275" y="610" width="200" height="50" rx="10" fill="#eef4ff" stroke="#1f6feb"/>
  <text x="375" y="632" text-anchor="middle" font-size="11" fill="#1f2430" font-weight="600">iframe 嵌入远端 GUI</text>
  <text x="375" y="648" text-anchor="middle" font-size="9" fill="#1f6feb">面板内 · 可交互</text>

  <line x1="480" y1="625" x2="540" y2="625" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="510" y="615" text-anchor="middle" font-size="9" fill="#5b6472">⌥⌘Enter</text>

  <rect x="545" y="605" width="200" height="50" rx="10" fill="#1f6feb" fill-opacity="0.08" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="645" y="627" text-anchor="middle" font-size="11" fill="#1f2430" font-weight="600">全屏远端 GUI</text>
  <text x="645" y="643" text-anchor="middle" font-size="9" fill="#1f6feb">几乎完整环境体验</text>

  <line x1="750" y1="625" x2="810" y2="625" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="780" y="615" text-anchor="middle" font-size="9" fill="#5b6472">再按 ⌥⌘Enter</text>

  <rect x="815" y="610" width="160" height="50" rx="10" fill="#f0f4f8" stroke="#c9d1de"/>
  <text x="895" y="632" text-anchor="middle" font-size="11" fill="#1f2430" font-weight="600">返回 iframe</text>
  <text x="895" y="648" text-anchor="middle" font-size="9" fill="#8a93a5">（面板内）</text>

  <!-- 返回箭头 -->
  <line x1="375" y1="665" x2="375" y2="695" stroke="#8a93a5" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="390" y="685" font-size="9" fill="#8a93a5">点击「← 返回」→ 回到环境列表</text>

  <!-- 场景一入口标注 -->
  <rect x="1050" y="610" width="190" height="80" rx="10" fill="#f0f7f2" stroke="#cfe5d4"/>
  <text x="1145" y="635" text-anchor="middle" font-size="10" fill="#2f7d4f" font-weight="600">场景一（不变）</text>
  <text x="1145" y="652" text-anchor="middle" font-size="9" fill="#5b6472">本地工作区 → 新建会话</text>
  <text x="1145" y="667" text-anchor="middle" font-size="9" fill="#5b6472">→ 自动绑定远端路由</text>
  <text x="1145" y="682" text-anchor="middle" font-size="9" fill="#8a93a5">（在本地侧栏，不在 iframe 里）</text>

  <!-- 场景二标注 -->
  <rect x="1050" y="710" width="190" height="70" rx="10" fill="#eef4ff" stroke="#1f6feb"/>
  <text x="1145" y="735" text-anchor="middle" font-size="10" fill="#1f6feb" font-weight="600">场景二（本原型）</text>
  <text x="1145" y="752" text-anchor="middle" font-size="9" fill="#5b6472">面板点「进入环境」</text>
  <text x="1145" y="767" text-anchor="middle" font-size="9" fill="#5b6472">→ iframe 远端完整 GUI</text>

  <text x="640" y="795" text-anchor="middle" font-size="10" fill="#8a93a5">两个场景独立使用：场景一在本地侧栏做远端的事；场景二在 iframe 里直接操作远端环境</text>
</svg>
