<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8a93a5"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#ffffff"/>
  <text x="462" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">同一个需求，两种做法</text>

  <!-- 左：远程工作区类 -->
  <rect x="30" y="60" width="410" height="270" rx="14" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="235" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#5b6472">远程工作区类插件（dsh-remote 等）</text>
  <rect x="70" y="115" width="150" height="66" rx="10" fill="#ffffff" stroke="#c9d1de"/>
  <text x="145" y="143" text-anchor="middle" font-size="12.5" fill="#1f2430" font-weight="600">本地 dsh</text>
  <text x="145" y="161" text-anchor="middle" font-size="11" fill="#5b6472">agent 在本地跑</text>
  <rect x="250" y="115" width="160" height="66" rx="10" fill="#ffffff" stroke="#c9d1de"/>
  <text x="330" y="143" text-anchor="middle" font-size="12.5" fill="#1f2430" font-weight="600">远端 = 文件系统</text>
  <text x="330" y="161" text-anchor="middle" font-size="11" fill="#5b6472">SFTP 工具集逐个取</text>
  <line x1="222" y1="148" x2="246" y2="148" stroke="#8a93a5" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="145" y="216" text-anchor="middle" font-size="11.5" fill="#8a93a5">模型凭据、SSH 配置都要在本地复制一份</text>
  <rect x="70" y="238" width="340" height="66" rx="10" fill="#eef1f6" stroke="#dfe3ea"/>
  <text x="240" y="264" text-anchor="middle" font-size="11.5" fill="#5b6472">远端只是文件与 shell</text>
  <text x="240" y="283" text-anchor="middle" font-size="11.5" fill="#5b6472">逐键往返 · 大目录遍历 · 配置双份</text>

  <!-- 右：dsh-control -->
  <rect x="480" y="60" width="410" height="270" rx="14" fill="#f0f7f2" stroke="#cfe5d4"/>
  <text x="685" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#2f7d4f">dsh-control</text>
  <rect x="520" y="115" width="150" height="66" rx="10" fill="#ffffff" stroke="#b8d8c2"/>
  <text x="595" y="143" text-anchor="middle" font-size="12.5" fill="#1f2430" font-weight="600">本地 dsh</text>
  <text x="595" y="161" text-anchor="middle" font-size="11" fill="#2f7d4f">你的侧栏 · 一个窗口</text>
  <rect x="700" y="115" width="160" height="66" rx="10" fill="#ffffff" stroke="#b8d8c2"/>
  <text x="780" y="143" text-anchor="middle" font-size="12.5" fill="#1f2430" font-weight="600">远端 = 一台 dsh</text>
  <text x="780" y="161" text-anchor="middle" font-size="11" fill="#2f7d4f">自己的凭据/工具干活</text>
  <line x1="672" y1="139" x2="696" y2="139" stroke="#2f7d4f" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="696" y1="160" x2="672" y2="160" stroke="#2f7d4f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="684" y="132" text-anchor="middle" font-size="10" fill="#2f7d4f">发话</text>
  <text x="684" y="176" text-anchor="middle" font-size="10" fill="#2f7d4f">会话原生流入</text>
  <text x="685" y="216" text-anchor="middle" font-size="11.5" fill="#5b6472">远端已装 dsh（≥0.2.0-rc.2）· 零远端改动</text>
  <rect x="520" y="238" width="340" height="66" rx="10" fill="#e7f3ea" stroke="#cfe5d4"/>
  <text x="690" y="264" text-anchor="middle" font-size="11.5" fill="#2f7d4f">远端会话成为本地一等公民</text>
  <text x="690" y="283" text-anchor="middle" font-size="11.5" fill="#2f7d4f">同一列表 · 同一搜索 · 流式逐字</text>

  <text x="462" y="362" text-anchor="middle" font-size="12" fill="#8a93a5">两者可同装：远端没装 dsh → 用 dsh-remote；装了 → 用 dsh-control</text>
</svg>
