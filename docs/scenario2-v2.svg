<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="-apple-system,'PingFang SC','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8a93a5"/>
    </marker>
  </defs>

  <text x="640" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2430">场景二·修订版：左侧栏「远程环境」顶级按钮 + 全宽 iframe</text>

  <!-- ═══════════ 状态 A：本地主界面（默认）═══════════ -->
  <rect x="20" y="50" width="500" height="420" rx="12" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="270" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">状态 A：本地主界面（默认）</text>

  <!-- 左侧栏 -->
  <rect x="32" y="90" width="170" height="370" rx="8" fill="#e8ebf0"/>
  <text x="117" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6472">左侧栏</text>

  <!-- 新会话按钮 -->
  <rect x="42" y="120" width="150" height="28" rx="6" fill="#fff" stroke="#c9d1de"/>
  <text x="117" y="138" text-anchor="middle" font-size="10" fill="#1f2430">＋ 新会话</text>

  <!-- 分隔 -->
  <line x1="42" y1="160" x2="192" y2="160" stroke="#d0d5dd" stroke-width="0.5"/>

  <!-- 导航按钮 -->
  <rect x="42" y="170" width="150" height="26" rx="5" fill="transparent"/>
  <text x="52" y="187" font-size="10" fill="#5b6472">💬 会话</text>

  <rect x="42" y="200" width="150" height="26" rx="5" fill="transparent"/>
  <text x="52" y="217" font-size="10" fill="#5b6472">🔌 插件</text>

  <rect x="42" y="230" width="150" height="26" rx="5" fill="transparent"/>
  <text x="52" y="247" font-size="10" fill="#5b6472">🏪 插件市场</text>

  <!-- 远程环境按钮（新增，高亮） -->
  <rect x="42" y="260" width="150" height="26" rx="5" fill="#e3f0e8" stroke="#2f7d4f" stroke-width="1"/>
  <text x="52" y="277" font-size="10" fill="#2f7d4f" font-weight="600">🌐 远程环境</text>
  <!-- 标注箭头 -->
  <line x1="195" y1="273" x2="230" y2="273" stroke="#2f7d4f" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="238" y="270" font-size="9" fill="#2f7d4f" font-weight="600">新增按钮</text>

  <!-- 会话列表 -->
  <line x1="42" y1="300" x2="192" y2="300" stroke="#d0d5dd" stroke-width="0.5"/>
  <text x="52" y="318" font-size="9" fill="#8a93a5">工作区</text>
  <text x="52" y="334" font-size="9" fill="#5b6472">  muse</text>
  <text x="52" y="348" font-size="9" fill="#5b6472">  loop</text>
  <text x="52" y="362" font-size="9" fill="#5b6472">  cn-dsh2</text>
  <text x="52" y="376" font-size="9" fill="#5b6472">  test</text>

  <!-- 主内容区（对话）-->
  <rect x="212" y="90" width="295" height="370" rx="8" fill="#fff" stroke="#c9d1de"/>
  <text x="360" y="115" text-anchor="middle" font-size="11" fill="#8a93a5">本地会话对话区</text>
  <rect x="225" y="130" width="270" height="80" rx="8" fill="#f5f7fa"/>
  <text x="235" y="150" font-size="9" fill="#1f2430">🤖 帮我看看磁盘占用</text>
  <text x="235" y="165" font-size="8" fill="#5b6472">df -h 输出：总共 100G…</text>
  <rect x="225" y="380" width="270" height="30" rx="6" fill="#f0f2f5"/>
  <text x="235" y="400" font-size="9" fill="#8a93a5">输入框…</text>

  <!-- ═══════════ 状态 B：远程环境页面 ═══════════ -->
  <rect x="545" y="50" width="500" height="420" rx="12" fill="#f6f7fa" stroke="#dfe3ea"/>
  <text x="795" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">状态 B：点击「远程环境」后（全宽页面）</text>

  <!-- 左侧栏 -->
  <rect x="557" y="90" width="170" height="370" rx="8" fill="#e8ebf0"/>

  <!-- 远程环境按钮高亮（active） -->
  <rect x="567" y="260" width="150" height="26" rx="5" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb"/>
  <text x="577" y="277" font-size="10" fill="#1f6feb" font-weight="600">🌐 远程环境 ●</text>

  <!-- 其他按钮正常 -->
  <rect x="567" y="170" width="150" height="26" rx="5" fill="transparent"/>
  <text x="577" y="187" font-size="10" fill="#5b6472">💬 会话</text>
  <rect x="567" y="200" width="150" height="26" rx="5" fill="transparent"/>
  <text x="577" y="217" font-size="10" fill="#5b6472">🔌 插件</text>
  <rect x="567" y="230" width="150" height="26" rx="5" fill="transparent"/>
  <text x="577" y="247" font-size="10" fill="#5b6472">🏪 插件市场</text>

  <!-- 主内容区：远程环境页面 -->
  <rect x="737" y="90" width="295" height="370" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>

  <!-- 顶栏：环境切换 tabs -->
  <rect x="737" y="90" width="295" height="36" rx="8" fill="#f0f4f8"/>
  <rect x="742" y="95" width="90" height="26" rx="6" fill="#1f6feb"/>
  <text x="787" y="112" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">cn-dsh2</text>
  <rect x="836" y="95" width="90" height="26" rx="6" fill="transparent" stroke="#c9d1de"/>
  <text x="881" y="112" text-anchor="middle" font-size="10" fill="#5b6472">server-2</text>
  <rect x="930" y="95" width="50" height="26" rx="6" fill="transparent" stroke="#c9d1de"/>
  <text x="955" y="112" text-anchor="middle" font-size="10" fill="#5b6472">＋</text>
  <text x="1022" y="112" font-size="9" fill="#8a93a5">✕ 返回本地</text>

  <!-- iframe 区域（远端 GUI）-->
  <rect x="742" y="132" width="285" height="323" rx="4" fill="#fafbfc"/>
  <!-- 远端 GUI 的侧栏 -->
  <rect x="742" y="132" width="55" height="323" fill="#e8ebf0" rx="4 0 0 4"/>
  <text x="769" y="160" text-anchor="middle" font-size="8" fill="#5b6472">远端</text>
  <text x="769" y="173" text-anchor="middle" font-size="8" fill="#5b6472">侧栏</text>
  <!-- 远端会话列表 -->
  <rect x="799" y="132" width="75" height="323" fill="#f0f2f5"/>
  <text x="807" y="150" font-size="7" fill="#5b6472">远端会话</text>
  <rect x="803" y="157" width="67" height="16" rx="3" fill="#dde5f0"/>
  <text x="809" y="168" font-size="6" fill="#1f2430">● 控制端·测试</text>
  <rect x="803" y="177" width="67" height="16" rx="3" fill="transparent"/>
  <text x="809" y="188" font-size="6" fill="#5b6472">数据分析</text>
  <rect x="803" y="197" width="67" height="16" rx="3" fill="transparent"/>
  <text x="809" y="208" font-size="6" fill="#5b6472">日报生成</text>
  <rect x="803" y="217" width="67" height="16" rx="3" fill="transparent"/>
  <text x="809" y="228" font-size="6" fill="#5b6472">爬虫监控</text>
  <rect x="803" y="237" width="67" height="16" rx="3" fill="transparent"/>
  <text x="809" y="248" font-size="6" fill="#5b6472">技能中心</text>
  <!-- 远端对话区 -->
  <rect x="876" y="132" width="151" height="323" fill="#fff" rx="0 4 4 0"/>
  <rect x="882" y="142" width="139" height="70" rx="6" fill="#f5f7fa"/>
  <text x="890" y="160" font-size="7" fill="#1f2430">🤖 帮我看看磁盘占用</text>
  <text x="890" y="173" font-size="6" fill="#5b6472">总计 100G，已用 78G</text>
  <text x="890" y="184" font-size="6" fill="#5b6472">/tmp 12G 可清理</text>
  <rect x="882" y="240" width="139" height="50" rx="6" fill="#eef4ff"/>
  <text x="890" y="258" font-size="7" fill="#1f2430">👤 运行 cleanup.sh</text>
  <text x="890" y="270" font-size="6" fill="#5b6472">正在执行…</text>
  <!-- 输入框 -->
  <rect x="882" y="410" width="100" height="24" rx="4" fill="#f0f2f5" stroke="#d0d5dd"/>
  <text x="890" y="426" font-size="6" fill="#8a93a5">发消息到远端…</text>

  <!-- iframe 标注 -->
  <rect x="742" y="132" width="285" height="323" fill="none" stroke="#1f6feb" stroke-dasharray="4 3" rx="4"/>
  <text x="884" y="466" text-anchor="middle" font-size="9" fill="#1f6feb">iframe：远端 dsh 的完整 GUI（占满整个主区域）</text>

  <!-- ═══════════ 切换箭头 ═══════════ -->
  <line x1="525" y1="260" x2="540" y2="260" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="248" text-anchor="middle" font-size="9" fill="#8a93a5">点击</text>
  <line x1="540" y1="280" x2="525" y2="280" stroke="#8a93a5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="295" text-anchor="middle" font-size="9" fill="#8a93a5">返回</text>

  <!-- ═══════════ 底部：实现机制 ═══════════ -->
  <rect x="20" y="490" width="1240" height="120" rx="10" fill="#f0f4f8"/>
  <text x="640" y="515" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">实现机制（照抄 dsh 内置「插件管理」面板的模式）</text>

  <text x="60" y="540" font-size="10" fill="#5b6472">① 注册左侧栏按钮：ctx.slots.inject("sidebar", () => ctx.slots.register({ name: "sidebar.panellist", key: "remote-env", options: { id: "remote-env", order: 15, label: "远程环境" } }))</text>
  <text x="60" y="558" font-size="10" fill="#5b6472">② 注册主区域页面：ctx.slots.inject("main", () => ctx.slots.register({ name: "main", key: "remote-env" }, RemoteEnvPage))</text>
  <text x="60" y="576" font-size="10" fill="#5b6472">③ 点击按钮 → ctx.layout.selectPanel("remote-env") → 主区域从"conversation"切换到 RemoteEnvPage</text>
  <text x="60" y="594" font-size="10" fill="#5b6472">④ RemoteEnvPage = 顶栏（环境 tabs + 返回） + iframe（远端完整 GUI）</text>

  <!-- ═══════════ 底部：对比 ═══════════ -->
  <rect x="20" y="625" width="1240" height="140" rx="10" fill="#fff" stroke="#dfe3ea"/>
  <text x="640" y="650" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2430">为什么这个方案比右侧面板 iframe 好</text>

  <text x="60" y="675" font-size="10" fill="#2f7d4f">✅ 全宽主区域（不是窄的右侧面板）——远端 GUI 有完整空间</text>
  <text x="60" y="693" font-size="10" fill="#2f7d4f">✅ 和「插件管理」「插件市场」同级——用户心智一致（"这是 dsh 的一个功能页"）</text>
  <text x="60" y="711" font-size="10" fill="#2f7d4f">✅ 多环境切换用顶栏 tabs——一眼看到所有远端环境，点击即切</text>
  <text x="60" y="729" font-size="10" fill="#2f7d4f">✅ 点「✕ 返回本地」或点左侧栏「💬 会话」即回到本地主界面——进出自然</text>
  <text x="60" y="747" font-size="10" fill="#8a93a5">ⓘ 右侧面板保留环境管理功能（连接/重连/移除），两个视图互补不冲突</text>
</svg>
